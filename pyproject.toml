[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hide-and-seek"
version = "0.1.0"
description = "Top-down greyscale flashlight hide-and-seek with pixel-based learned agents."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "Pillow>=10.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
generate = "hide_and_seek.cli:main"

[tool.setuptools.packages.find]
include = ["hide_and_seek*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
